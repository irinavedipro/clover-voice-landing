e{font-size:34px!important}\n    .cv-hero-headline{font-size:64px!important}\n  }\n</style>\n</helmet>\n<div style=\"background:#1A0F0C;color:#FBF7F1;font-family:'Raleway',sans-serif;font-weight:300;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;\">\n\n<div class=\"cv-page\" style=\"max-width:480px;margin:0 auto;padding:0 28px;\">\n\n  <!-- HERO -->\n  <div class=\"cv-herowrap\" style=\"display:flex;flex-direction:column;\">\n    <section class=\"cv-hero\" style=\"padding:64px 0 40px;text-align:center;position:relative;\">\n      <span class=\"cv-fade1\" style=\"font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#D9A54A;margin-bottom:26px;display:block;\">Clover Voice · Сочи</span>\n      <p class=\"cv-fade2\" style=\"font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:rgba(251,247,241,.78);margin-bottom:20px;\">Действующая певица · Школа Clover Voice · Сочи</p>\n      <h1 class=\"cv-hero-headline cv-fade3\" style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:38px;font-weight:600;line-height:1.12;color:#FBF7F1;margin-bottom:26px;\">На сцену<br>за 60 дней</h1>\n      <div class=\"cv-hero-divider cv-fade4\" style=\"width:44px;height:2px;background:#D9A54A;margin:0 auto 24px;\"></div>\n      <p class=\"cv-fade5\" style=\"font-size:16px;line-height:1.7;color:rgba(251,247,241,.85);margin-bottom:34px;\">Я не учу петь.<br>Я учу не молчать.<br>Через 60 дней сцена твоя.</p>\n      <a href=\"#cta\" class=\"cv-cta cv-fade6\" style=\"display:inline-block;padding:15px 34px;border:1px solid #D9A54A;color:#F0C878;font-family:'Raleway',sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;transition:all .25s;\">Написать «Голос»</a>\n    </section>\n\n    <!-- STAGE IMAGE -->\n    <section class=\"cv-stagewrap\" style=\"padding:0 0 48px;\" aria-label=\"Светлана Клевер на сцене\">\n
